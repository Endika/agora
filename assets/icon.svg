<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Agora">
  <!--
    The same freehand colonnade as the header wordmark, so the tab, the launcher and the app all show
    one drawing. Verified legible at 32 px: the wobble disappears but the three columns hold.
