    <path d="M34.9 13.2c.6 8.6.7 17.2.4 25.6"/>
    <path d="M10.8 15.4c1.9-.5 3.8-.6 5.7-.3"/>
    <path d="M21.5 7.6c1.9-.4 3.8-.5 5.7-.2"/>
    <path d="M32.1 12.2c1.9-.4 3.8-.4 5.6-.1"/>
