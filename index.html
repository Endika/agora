<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom stays enabled on purpose: WCAG 2.2 asks for 400% reflow (eskills:ux-bar). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#EBEDE7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151A18" media="(prefers-color-scheme: dark)" />
    <title>Agora</title>
    <script>
      // Apply the stored theme before first paint so the ground never flashes.
      ;(function () {
        try {
          var stored = localStorage.getItem('agora:theme')
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
